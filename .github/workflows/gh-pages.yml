name: Publish to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare publish directory
        run: |
          rm -rf public || true
          mkdir public
          # Copy repository files to public, excluding GitHub workflow files and node_modules if present
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' ./ public/

      - name: Upload artifact for GitHub Pages
        # Use the GitHub Pages artifact action (stable)
        uses: actions/upload-pages-artifact@v1
        with:
          path: public

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
