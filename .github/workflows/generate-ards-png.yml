name: Generate ARDS QR PNG and commit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ards-tool.html'
      - '.github/workflows/generate-ards-png.yml'

permissions:
  contents: write

jobs:
  download-and-commit-png:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download QR PNG
        run: |
          curl -L "https://api.qrserver.com/v1/create-qr-code/?size=3000x3000&data=https%3A%2F%2Fapoorvabeats-cyber.github.io%2FSAH-decision-tree%2Fards-tool.html&format=png&ecc=H" -o ards-tool-qr-3000.png

      - name: Commit and push PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f ards-tool-qr-3000.png ]; then
            git add ards-tool-qr-3000.png
            git commit -m "Add ARDS QR PNG (generated)" || echo "No changes to commit"
            git push origin HEAD:main
          else
            echo "PNG not found or unchanged"
          fi
